[project]
name = "lakehouse"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pyspark>=3.5,<4", "delta-spark>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
